<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11122f"><meta name="description" content="Strike a birthday match for Seb."><title>A birthday match for Seb</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23ffd76b' d='M28 25h8v34h-8z'/%3E%3Cpath fill='%23ff9a45' d='M32 4c10 11 7 19 0 22-7-3-10-11 0-22z'/%3E%3C/svg%3E"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11122f}body{color:#fff8e7;font-family:Georgia,'Times New Roman',serif}.scene{position:relative;width:100%;height:100svh;min-height:540px;overflow:hidden;background:radial-gradient(circle at 50% 42%,#343568 0,#1d2048 42%,#0d102a 100%)}canvas{display:block;width:100%;height:100%}.prompt{position:absolute;z-index:2;top:16%;left:16px;right:16px;text-align:center;transition:.6s ease;pointer-events:none}.prompt h1{margin:0;font-size:clamp(2.2rem,7vw,4.6rem);font-weight:400;line-height:1.02;letter-spacing:-.035em}.prompt p{margin:.75rem 0 0;font:700 .7rem/1 Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#c5c9ef}.started .prompt{opacity:0;transform:translateY(-12px)}.strike{position:absolute;z-index:3;left:50%;top:45%;width:min(72vw,310px);height:100px;transform:translate(-50%,-50%);border:0;background:transparent;cursor:pointer}.strike:focus-visible{outline:2px solid #fff;outline-offset:8px;border-radius:50px}.final{position:absolute;z-index:3;top:7%;left:8px;right:8px;text-align:center;opacity:0;transform:scale(.74);pointer-events:none}.final strong{display:block;font-size:clamp(3.3rem,12vw,7.4rem);font-weight:400;line-height:.88;letter-spacing:-.05em;text-shadow:0 0 10px #fff,0 0 32px #ffd35f}.final span{display:block;margin-top:14px;font:700 .7rem/1 Arial,sans-serif;letter-spacing:.26em;text-transform:uppercase;color:#d9dcff}.complete .final{animation:show 1s cubic-bezier(.18,1.28,.3,1) forwards}@keyframes show{to{opacity:1;transform:scale(1)}}@media(max-height:650px){.prompt{top:9%}.final{top:4%}}
</style></head><body><main class="scene" id="scene"><canvas id="art" aria-label="A match lights Seb's birthday cake"></canvas><section class="prompt"><h1>Strike a match for Seb.</h1><p>Tap the match</p></section><button id="strike" class="strike" aria-label="Strike Seb's birthday match"></button><section class="final" aria-live="polite"><strong>Happy Birthday!</strong><span>Make it a brilliant one, Seb</span></section></main><script>
(()=>{const c=document.querySelector('#art'),g=c.getContext('2d'),scene=document.querySelector('#scene'),btn=document.querySelector('#strike'),blow=document.createElement('button');blow.type='button';blow.innerHTML='<strong>Blow out the candles</strong><span>or tap here</span>';blow.setAttribute('aria-label','Blow out the birthday candles');blow.style.cssText='position:absolute;z-index:5;left:50%;bottom:7%;transform:translateX(-50%) translateY(12px);padding:11px 18px;border:1px solid #fff8e788;border-radius:999px;background:#11122fcc;color:#fff8e7;font:700 12px/1.25 Arial,sans-serif;letter-spacing:.08em;text-align:center;opacity:0;pointer-events:none;transition:.5s;backdrop-filter:blur(8px);cursor:pointer';blow.querySelector('span').style.cssText='display:block;margin-top:3px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#d9dcff';scene.appendChild(blow);let W,H,D,t0=0,on=false,A,master,stars=[],analyser,micData,blowFrames=0,blown=false,blowAt=0,confetti=[];const C=(n,a=0,b=1)=>Math.max(a,Math.min(b,n)),E=n=>1-Math.pow(1-C(n),3),L=(a,b,t)=>a+(b-a)*t;
function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);stars=Array.from({length:42},(_,i)=>({x:(i*71%941)/941*W,y:(i*53%401)/401*H*.72,r:.5+(i%3)*.35,p:i*.8}))}addEventListener('resize',size);size();
function glow(x,y,r,col='#ffd56b'){const q=g.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,'#fffde4');q.addColorStop(.18,col);q.addColorStop(1,'transparent');g.fillStyle=q;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function bg(t,bright){g.clearRect(0,0,W,H);for(const s of stars){g.globalAlpha=.18+.38*Math.sin(t*.0012+s.p)+bright*.22;g.fillStyle='#fff0a5';g.beginPath();g.arc(s.x,s.y,s.r,0,7);g.fill()}g.globalAlpha=1}
function flame(x,y,s,t){glow(x,y,32*s);g.fillStyle='#fff4a3';g.beginPath();g.moveTo(x,y-15*s);g.bezierCurveTo(x+10*s,y-3*s,x+7*s,y+10*s,x,y+12*s);g.bezierCurveTo(x-9*s,y+7*s,x-8*s,y-3*s,x,y-15*s);g.fill();g.fillStyle='#ff9d48';g.beginPath();g.ellipse(x,y+3*s,3*s,7*s,Math.sin(t*.01)*.08,0,7);g.fill()}
function match(x,y,angle,lit,t){g.save();g.translate(x,y);g.rotate(angle);g.lineCap='round';g.strokeStyle='#e5c28a';g.lineWidth=7;g.beginPath();g.moveTo(-72,0);g.lineTo(62,0);g.stroke();g.fillStyle=lit?'#2f2225':'#c65e55';g.beginPath();g.ellipse(70,0,12,9,0,0,7);g.fill();if(lit)flame(72,-10,1,t);g.restore()}
function tier(y,w,h,color){g.fillStyle='rgba(0,0,20,.22)';g.beginPath();g.roundRect(-w/2+4,y+7,w,h,14);g.fill();g.fillStyle=color;g.strokeStyle='#fffaf1';g.lineWidth=3;g.beginPath();g.roundRect(-w/2,y,w,h,14);g.fill();g.stroke();g.fillStyle='#fffaf1';g.beginPath();g.ellipse(0,y+3,w/2-2,9,0,0,7);g.fill();g.fillStyle='#f3c96f';for(let x=-w*.31;x<=w*.31;x+=w*.155){g.beginPath();g.arc(x,y+h*.62,3,0,7);g.fill()}}
function candleRow(xs,y,h,offset,lit,t){xs.forEach((x,i)=>{g.fillStyle=(i+offset)%3===0?'#f3a9bd':(i+offset)%3===1?'#78c8df':'#f2cf69';g.fillRect(x-2.2,y-h,4.4,h);g.fillStyle='#fff8e9';g.fillRect(x-2.2,y-h+5,4.4,2);if(lit>(offset+i)/26)flame(x,y-h-5,.34,t)})}
function cake(p,lit,t){const s=Math.min(1.06,Math.max(.72,W/390),H/610),finalBase=H*(W<=600?.63:.72),base=L(H+95,finalBase,E(p));g.save();g.translate(W/2,base);g.scale(s,s);g.fillStyle='#dff5f3';g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.ellipse(0,8,112,16,0,0,7);g.fill();g.stroke();tier(-45,198,52,'#8fcfd7');tier(-90,151,48,'#b8abe0');tier(-131,106,44,'#efb7d1');candleRow([-88,-78,-68,-58,-48,48,58,68,78,88],-47,15,0,lit,t);candleRow([-66,-57,-48,-39,0,39,48,57,66],-92,17,10,lit,t);candleRow([-42,-28,-14,0,14,28,42],-133,22,19,lit,t);g.restore()}
function prepareAudio(){try{A=new(window.AudioContext||window.webkitAudioContext)();A.resume();master=A.createGain();master.gain.value=.62;master.connect(A.destination)}catch(e){}}
function music(){if(!A||!master)return;const N=[[392,.28],[392,.18],[440,.45],[392,.45],[523,.45],[494,.8],[392,.28],[392,.18],[440,.45],[392,.45],[587,.45],[523,.8],[392,.28],[392,.18],[784,.45],[659,.45],[523,.45],[494,.45],[440,.8],[698,.28],[698,.18],[659,.45],[523,.45],[587,.45],[523,.9]];let at=A.currentTime+.05;N.forEach(([f,d])=>{[['triangle',f,.11],['sine',f*2,.018]].forEach(([type,h,v])=>{const o=A.createOscillator(),q=A.createGain();o.type=type;o.frequency.value=h;q.gain.setValueAtTime(.001,at);q.gain.linearRampToValueAtTime(v,at+.03);q.gain.exponentialRampToValueAtTime(.001,at+d);o.connect(q).connect(master);o.start(at);o.stop(at+d+.04)});at+=d})}
async function prepareMic(){try{const stream=await navigator.mediaDevices.getUserMedia({audio:true}),src=A.createMediaStreamSource(stream);analyser=A.createAnalyser();analyser.fftSize=256;micData=new Uint8Array(analyser.fftSize);src.connect(analyser)}catch(e){}}
function burst(){const colors=['#ffd76b','#f3a9bd','#78c8df','#c3b5e7','#fff8e7'];confetti=Array.from({length:90},(_,i)=>({x:Math.random()*W,y:-20-Math.random()*H*.3,v:2.5+Math.random()*4,w:4+Math.random()*5,h:7+Math.random()*8,r:Math.random()*6,c:colors[i%colors.length],s:(Math.random()-.5)*.16}))}
function extinguish(){if(blown)return;blown=true;blowAt=performance.now();blow.style.opacity=0;blow.style.pointerEvents='none';scene.classList.add('complete');burst();music()}
function drawConfetti(){for(const p of confetti){p.y+=p.v;p.r+=p.s;p.x+=Math.sin(p.r)*.7;if(p.y>H+20)p.y=-20;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.w/2,-p.h/2,p.w,p.h);g.restore()}}
function hearBlow(){if(!analyser||blown)return;analyser.getByteTimeDomainData(micData);let sum=0;for(const x of micData){const n=(x-128)/128;sum+=n*n}const rms=Math.sqrt(sum/micData.length);blowFrames=rms>.12?blowFrames+1:Math.max(0,blowFrames-1);if(blowFrames>4)extinguish()}
function draw(t){const e=on?(t-t0)/1000:0,lit=C((e-1.65)/.85),rise=C((e-.8)/1.2),visibleLit=blown?lit*C(1-(t-blowAt)/380):lit;bg(t,visibleLit);cake(rise,visibleLit,t);if(!on){g.strokeStyle='#a97266';g.lineWidth=5;g.beginPath();g.moveTo(W/2-95,H*.45+23);g.lineTo(W/2+95,H*.45+23);g.stroke();match(W/2,H*.45,0,false,t)}else if(e<1.7){const strike=E(e/.48),travel=E((e-.45)/1.15),x=e<.5?L(W*.38,W*.62,strike):L(W*.62,W*.5,travel),cakeTop=H*(W<=600?.63:.72)-175,y=e<.5?H*.45:L(H*.45,cakeTop,travel),ang=e<.5?-.12:L(-.12,.45,travel);match(x,y,ang,e>.28,t);if(e<.55)for(let i=0;i<12;i++){g.fillStyle='#ffd35c';g.globalAlpha=C(1-e/.6);g.fillRect(W*.45+i*8+Math.sin(i)*7,H*.45+(i%4)*5,3,3)}g.globalAlpha=1}if(e>2.7&&!blown){blow.style.opacity=1;blow.style.transform='translateX(-50%)';blow.style.pointerEvents='auto';hearBlow()}if(blown)drawConfetti();requestAnimationFrame(draw)}
blow.addEventListener('click',extinguish);btn.addEventListener('click',()=>{on=true;t0=performance.now();scene.classList.add('started');btn.disabled=true;prepareAudio();prepareMic()},{once:true});requestAnimationFrame(draw)})();
</script></body></html>
