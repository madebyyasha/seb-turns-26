<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#69cdf4" />
  <meta name="description" content="Row in and light the candles for Seb's 26th birthday." />
  <title>Seb turns 26</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050810'/%3E%3Cpath d='M29 19h6v24h-6z' fill='%23f7e8c8'/%3E%3Cpath d='M32 8c8 8 6 14 0 16-6-2-8-8 0-16z' fill='%23ff7a25'/%3E%3C/svg%3E" />
  <style>
    :root{--cream:#fffdf4;--orange:#ff6f4f;--aqua:#23bde3;--yellow:#ffd94d;--green:#4ebf67;--sky:#7ed8f7}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;min-height:100dvh;margin:0;overflow:hidden}
    body{background:var(--sky);color:#073a59;font-family:Georgia,'Times New Roman',serif}
    button{font:inherit}
    main{position:relative;width:100%;height:100%;min-height:100dvh;isolation:isolate;background:linear-gradient(#67cdf4 0%,#bcecff 52%,#f8fdff 61%,#35bde7 62%,#078fc5 100%)}
    .stars{display:none}
    .water{position:absolute;z-index:1;left:0;right:0;bottom:0;height:39%;opacity:.72;background:repeating-radial-gradient(ellipse at 50% 0,#ffffff99 0 2px,#3ad2ef55 3px 11px,#078fc555 12px 20px);mask-image:linear-gradient(transparent,#000 18%);animation:waterMove 5s linear infinite}
    @keyframes waterMove{to{background-position:110px 18px}}

    .headline{position:absolute;z-index:6;top:4.5vh;left:50%;width:min(92vw,760px);transform:translateX(-50%);text-align:center;transition:opacity .65s ease,transform .65s ease}
    h1{margin:0;font-size:clamp(2.5rem,7vw,5.8rem);line-height:.92;letter-spacing:-.05em;font-weight:500;text-wrap:balance;text-shadow:0 3px 0 #ffffff88}
    .arrived .headline,.lit .headline{opacity:0;transform:translate(-50%,-18px)}

    .island{position:absolute;z-index:2;left:86%;bottom:15vh;width:min(25vw,310px);transform:translateX(-50%);filter:drop-shadow(0 16px 22px #000b);pointer-events:none;user-select:none;-webkit-user-drag:none;transition:left .78s cubic-bezier(.18,.82,.22,1),bottom .78s cubic-bezier(.18,.82,.22,1),width .78s cubic-bezier(.18,.82,.22,1),filter .78s ease}
    .arrived .island{left:57%;bottom:2.5vh;width:min(82vw,980px);filter:drop-shadow(0 24px 32px #000b)}

    .rower{position:absolute;z-index:6;left:-12vw;bottom:3vh;width:min(46vw,600px);padding:0;border:0;background:none;cursor:pointer;touch-action:manipulation;filter:drop-shadow(0 16px 20px #000b);transform-origin:50% 65%}
    .rower img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
    .rower:hover{transform:rotate(-1deg) translateY(-3px)}
    .rowing .rower{pointer-events:none;animation:rowAcross 2.45s cubic-bezier(.18,.72,.25,1) forwards}
    @keyframes rowAcross{
      0%{transform:translateX(0) translateY(0) rotate(0);opacity:1}
      18%{transform:translateX(11vw) translateY(-8px) rotate(-2deg)}
      38%{transform:translateX(22vw) translateY(3px) rotate(2deg)}
      58%{transform:translateX(33vw) translateY(-8px) rotate(-2deg)}
      78%{transform:translateX(44vw) translateY(2px) rotate(1deg);opacity:1}
      100%{transform:translateX(59vw) translateY(-3px) rotate(0);opacity:0}
    }

    .cake-stage{position:absolute;z-index:4;left:55%;top:48%;width:min(49vw,470px);aspect-ratio:2/3;opacity:0;transform:translate(-50%,-50%) scale(.04);transform-origin:50% 92%;filter:drop-shadow(0 22px 32px #000c)}
    .arrived .cake-stage{animation:cakeBurst .72s .66s cubic-bezier(.16,1.28,.3,1) forwards}
    @keyframes cakeBurst{
      0%{opacity:0;transform:translate(-50%,-50%) scale(.04) rotate(-5deg)}
      58%{opacity:1;transform:translate(-50%,-50%) scale(1.14) rotate(2deg)}
      78%{transform:translate(-50%,-50%) scale(.96) rotate(-1deg)}
      100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}
    }
    .cake-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .3s ease;user-select:none;-webkit-user-drag:none}
    .cake-lit{opacity:0;filter:drop-shadow(0 0 22px #ff9c4b77)}
    .lit .cake-unlit{opacity:0}
    .lit .cake-lit{opacity:1;animation:candleGlow 1.35s ease-in-out infinite alternate}
    @keyframes candleGlow{to{filter:drop-shadow(0 0 42px #ff9d53bb)}}

    .lighter{position:absolute;z-index:8;left:50%;bottom:2.7vh;width:100px;height:82px;transform:translateX(-50%);border:0;background:none;pointer-events:none;opacity:0}
    .arrived .lighter{opacity:1}
    .chrome-lighter{position:absolute;right:30px;top:7px;width:45px;height:54px;border-radius:6px 6px 9px 9px;background:linear-gradient(110deg,#797979 0,#f4f4f0 28%,#777 55%,#d9d9d4 78%,#555 100%);box-shadow:inset 0 0 0 2px #ffffff55,0 9px 15px #0008}
    .chrome-lighter::before{content:"";position:absolute;left:8px;top:-10px;width:27px;height:15px;border-radius:4px 4px 2px 2px;background:repeating-linear-gradient(90deg,#555 0 3px,#bbb 3px 5px)}
    .flame{position:absolute;left:14px;top:-34px;width:17px;height:30px;border-radius:55% 45% 58% 42%;background:radial-gradient(circle at 50% 70%,#fff8b5 0 18%,#ffb12e 42%,#ff5f20 72%,transparent 74%);transform:scale(.1) rotate(8deg);opacity:0;transform-origin:50% 100%}
    .lighting .chrome-lighter{animation:lighterJourney 2.35s cubic-bezier(.42,.02,.22,1) forwards}
    .lighting .flame{animation:lighterFlame .42s ease-out forwards}
    @keyframes lighterFlame{35%,100%{opacity:1;transform:scale(1) rotate(8deg)}}
    @keyframes lighterJourney{
      0%{transform:translate(0,0) rotate(0)}
      16%{transform:translate(-105px,-27vh) rotate(-9deg)}
      31%{transform:translate(105px,-27vh) rotate(9deg)}
      47%{transform:translate(-78px,-45vh) rotate(-8deg)}
      63%{transform:translate(78px,-45vh) rotate(8deg)}
      80%{transform:translate(-48px,-65vh) rotate(-7deg)}
      100%{transform:translate(48px,-65vh) rotate(7deg)}
    }
    .lit .lighter{opacity:0;pointer-events:none}


    .birthday{position:absolute;z-index:7;left:50%;bottom:4.3vh;width:min(94vw,850px);margin:0;transform:translate(-50%,18px);opacity:0;text-align:center;color:#fff;font-size:clamp(3rem,8.6vw,6.6rem);line-height:.88;letter-spacing:-.055em;font-weight:500;text-wrap:balance;text-shadow:0 5px 0 #0786b7,0 10px 28px #04557988}
    .lit .birthday{animation:reveal .8s .18s ease forwards}
    @keyframes reveal{to{opacity:1;transform:translate(-50%,0)}}

    .confetti{position:absolute;z-index:5;inset:0;overflow:hidden;pointer-events:none}
    .confetti i{position:absolute;top:-12vh;width:8px;height:16px;background:var(--c);animation:fall var(--d) var(--delay) linear infinite}
    @keyframes fall{to{transform:translate3d(var(--drift),115vh,0) rotate(760deg)}}

    @media(max-width:640px){
      .headline{top:3.5vh}
      .island{left:86%;bottom:17vh;width:42vw;max-width:none}
      .arrived .island{left:58%;bottom:6vh;width:126vw}
      .cake-stage{left:55%;top:43%;width:min(82vw,42dvh,350px)}
      .rower{left:-38vw;bottom:8vh;width:min(104vw,500px)}
      .lighter{bottom:max(2.2vh,env(safe-area-inset-bottom));transform:translateX(-50%) scale(.9)}
      .lighting .chrome-lighter{animation-name:lighterJourneyMobile}
      .birthday{bottom:5.6vh;font-size:clamp(2.8rem,14.5vw,4.8rem)}
      .lit .cake-stage{top:41%}
      @keyframes rowAcross{
        0%{transform:translateX(0) translateY(0) rotate(0);opacity:1}
        20%{transform:translateX(14vw) translateY(-7px) rotate(-2deg)}
        40%{transform:translateX(28vw) translateY(3px) rotate(2deg)}
        60%{transform:translateX(42vw) translateY(-7px) rotate(-2deg)}
        80%{transform:translateX(58vw) translateY(2px) rotate(1deg);opacity:1}
        100%{transform:translateX(72vw) translateY(-3px) rotate(0);opacity:0}
      }
      @keyframes lighterJourneyMobile{
        0%{transform:translate(0,0) rotate(0)}
        16%{transform:translate(-31vw,-34vh) rotate(-9deg)}
        31%{transform:translate(31vw,-34vh) rotate(9deg)}
        47%{transform:translate(-23vw,-53vh) rotate(-8deg)}
        63%{transform:translate(23vw,-53vh) rotate(8deg)}
        80%{transform:translate(-14vw,-72vh) rotate(-7deg)}
        100%{transform:translate(14vw,-72vh) rotate(7deg)}
      }
    }
    @media(max-width:640px) and (max-height:650px){
      .headline{top:2.2vh}
      h1{font-size:clamp(2rem,10vw,3rem)}
      .island{bottom:14vh}
      .arrived .island{bottom:3vh}
      .cake-stage{top:43%;width:min(66vw,38dvh)}
      .birthday{bottom:4vh;font-size:clamp(2.4rem,12vw,3.7rem)}
    }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
  </style>
</head>
<body>
  <main id="stage">
    <div class="stars"></div>
    <div class="water" aria-hidden="true"></div>
    <header class="headline">
      <h1>Tap to row</h1>
    </header>

    <button id="rower" class="rower" type="button" aria-label="Help Seb row to his birthday cake">
      <img src="assets/seb-rowing-v2.png" alt="Seb rowing toward his birthday cake" />
    </button>

    <img class="island" src="assets/seb-island-summer.png" alt="A small sunny island waiting for Seb" />

    <div class="cake-stage">
      <img class="cake-unlit" src="assets/seb-cake-summer-unlit.png" alt="A summery three-tier birthday cake with unlit candles on every tier" />
      <img class="cake-lit" src="assets/seb-cake-summer-lit.png" alt="The same summery cake with every candle glowing" />
    </div>

    <div id="lighter" class="lighter" aria-hidden="true">
      <span class="chrome-lighter"><span class="flame"></span></span>
    </div>
    <div id="confetti" class="confetti" aria-hidden="true"></div>
    <h2 class="birthday">Happy Birthday!!</h2>
  </main>

  <script>
    let audioCtx;
    const stage=document.querySelector('#stage'),rower=document.querySelector('#rower');
    function ensureAudio(){audioCtx||=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
    function tone(freq,start,duration,volume,type='triangle',detune=0){
      const ctx=ensureAudio(),osc=ctx.createOscillator(),gain=ctx.createGain(),filter=ctx.createBiquadFilter();
      osc.type=type;osc.frequency.value=freq;osc.detune.value=detune;filter.type='lowpass';filter.frequency.value=type==='sawtooth'?1400:3400;
      gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(volume,start+.045);gain.gain.setValueAtTime(volume*.78,Math.max(start+.06,start+duration-.12));gain.gain.exponentialRampToValueAtTime(.0001,start+duration);
      osc.connect(filter).connect(gain).connect(ctx.destination);osc.start(start);osc.stop(start+duration+.04)
    }
    function kick(at,volume=.48){
      const ctx=ensureAudio(),osc=ctx.createOscillator(),gain=ctx.createGain();
      osc.type='sine';osc.frequency.setValueAtTime(150,at);osc.frequency.exponentialRampToValueAtTime(43,at+.13);
      gain.gain.setValueAtTime(volume,at);gain.gain.exponentialRampToValueAtTime(.0001,at+.24);
      osc.connect(gain).connect(ctx.destination);osc.start(at);osc.stop(at+.25)
    }
    function noiseHit(at,duration,volume,highpass){
      const ctx=ensureAudio(),buffer=ctx.createBuffer(1,ctx.sampleRate*duration,ctx.sampleRate),data=buffer.getChannelData(0);
      for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;
      const src=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),gain=ctx.createGain();src.buffer=buffer;filter.type='highpass';filter.frequency.value=highpass;
      gain.gain.setValueAtTime(volume,at);gain.gain.exponentialRampToValueAtTime(.0001,at+duration);
      src.connect(filter).connect(gain).connect(ctx.destination);src.start(at);src.stop(at+duration)
    }
    function bass(freq,at,duration){
      const ctx=ensureAudio(),osc=ctx.createOscillator(),gain=ctx.createGain(),filter=ctx.createBiquadFilter();
      osc.type='sawtooth';osc.frequency.value=freq;filter.type='lowpass';filter.frequency.setValueAtTime(170,at);filter.frequency.exponentialRampToValueAtTime(680,at+.035);filter.frequency.exponentialRampToValueAtTime(150,at+duration);
      gain.gain.setValueAtTime(.0001,at);gain.gain.exponentialRampToValueAtTime(.085,at+.012);gain.gain.exponentialRampToValueAtTime(.0001,at+duration);
      osc.connect(filter).connect(gain).connect(ctx.destination);osc.start(at);osc.stop(at+duration+.02)
    }
    function playHappyBirthday(){
      const ctx=ensureAudio(),start=ctx.currentTime+.08,beat=60/132,G=392,A=440,B=493.88,C=523.25,D=587.33,E=659.25,F=698.46,G5=783.99;
      const song=[[G,.5],[G,.5],[A,1],[G,1],[C,1],[B,2],[G,.5],[G,.5],[A,1],[G,1],[D,1],[C,2],[G,.5],[G,.5],[G5,1],[E,1],[C,1],[B,1],[A,2],[F,.5],[F,.5],[E,1],[C,1],[D,1],[C,2]];
      let totalBeats=0;song.forEach(([,b])=>totalBeats+=b);
      for(let b=0;b<totalBeats;b++){
        const at=start+b*beat;kick(at,b%4===0?.58:.46);bass([65.41,65.41,87.31,73.42][b%4],at+.035,beat*.42);
        noiseHit(at+beat*.5,.055,.055,6500);if(b%4===1||b%4===3)noiseHit(at,.12,.06,1200)
      }
      let t=start;
      song.forEach(([f,b])=>{const d=Math.max(.1,b*beat*.82);tone(f,t,d,.075,'square',-7);tone(f,t,d,.055,'sawtooth',7);tone(f*2,t,d*.58,.018,'sine');t+=b*beat});
      tone(261.63,t,beat*1.6,.065,'sawtooth');tone(523.25,t,beat*1.6,.048,'square');kick(t,.7)
    }
    function launchConfetti(){
      const box=document.querySelector('#confetti'),colors=['#ff6f4f','#ffd94d','#ffffff','#23bde3','#4ebf67'];
      for(let i=0;i<72;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.setProperty('--c',colors[i%colors.length]);p.style.setProperty('--d',(3+Math.random()*2.7)+'s');p.style.setProperty('--delay',(-Math.random()*3)+'s');p.style.setProperty('--drift',(-75+Math.random()*150)+'px');box.appendChild(p)}
    }
    rower.addEventListener('click',()=>{
      ensureAudio();rower.disabled=true;stage.classList.add('rowing');
      setTimeout(()=>stage.classList.add('arrived'),2350);
      setTimeout(()=>stage.classList.add('lighting'),3500);
      setTimeout(()=>{stage.classList.remove('lighting');stage.classList.add('lit');launchConfetti();playHappyBirthday()},5790)
    });
  </script>
</body>
</html>
