<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#9bd8ef"><meta name="description" content="A tiny birthday voyage for Seb."><title>Seb turns 26</title>
<style>
:root{--navy:#102a43;--blue:#147ea6;--sky:#9bd8ef;--cream:#fff8e7;--red:#f04f3d;--yellow:#ffd45c;--green:#4f9b69}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font-family:Arial,Helvetica,sans-serif;background:var(--sky);color:var(--navy)}button{font:inherit}.scene{position:relative;width:100%;height:100svh;min-height:520px;overflow:hidden;isolation:isolate;background:linear-gradient(#b9e7f5 0 60%,#2694ba 60% 100%)}.scene:after{content:"";position:absolute;z-index:1;left:0;right:0;top:60%;height:3px;background:var(--cream);opacity:.9}.prompt,.birthday{position:absolute;z-index:20;left:50%;top:8%;width:94%;margin:0;text-align:center;transform:translateX(-50%);font-size:clamp(2.4rem,7vw,5.6rem);font-weight:800;letter-spacing:-.065em;line-height:.9}.prompt{transition:.35s ease}.rowing .prompt{opacity:0;transform:translate(-50%,-12px)}.birthday{color:var(--cream);opacity:0;transform:translate(-50%,16px) scale(.92);text-shadow:0 4px 0 var(--navy)}.lit .birthday{animation:title .65s cubic-bezier(.2,1.3,.35,1) forwards}@keyframes title{to{opacity:1;transform:translate(-50%,0) scale(1)}}
.rower{position:absolute;z-index:8;left:-6%;bottom:5%;width:min(49vw,680px);padding:0;border:0;background:none;cursor:pointer;touch-action:manipulation;filter:drop-shadow(0 13px 10px #123b5060);animation:float 1.45s ease-in-out infinite alternate}.rower img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}@keyframes float{to{transform:translateY(-7px)}}.rowing .rower{animation:cross 2.45s cubic-bezier(.3,.65,.25,1) forwards}@keyframes cross{0%{left:-6%;bottom:5%;transform:none}25%{transform:translateY(-10px) rotate(-1deg)}50%{transform:translateY(1px) rotate(1deg)}75%{transform:translateY(-8px) rotate(-1deg);opacity:1}100%{left:58%;bottom:17%;transform:scale(.42);opacity:0}}.wake{position:absolute;z-index:4;left:2%;bottom:13%;width:34vw;height:4px;border-radius:50%;background:var(--cream);opacity:.7;transform:scaleX(.7);transform-origin:left;animation:wake 1.4s ease-in-out infinite alternate}@keyframes wake{to{transform:scaleX(1);opacity:.3}}.rowing .wake{animation:trail 2.35s ease-out forwards}@keyframes trail{to{left:63%;width:11vw;opacity:0}}
.island{position:absolute;z-index:5;right:5%;bottom:17%;width:118px;height:42px;border-radius:52% 48% 44% 56%;background:linear-gradient(var(--green) 0 34%,#f5d18a 35% 74%,#c9864c 75%);box-shadow:0 7px 0 #ffffff88;transition:.78s cubic-bezier(.16,1.15,.3,1)}.arrived .island{right:50%;bottom:4%;width:min(82vw,820px);height:126px;transform:translateX(50%);box-shadow:0 10px 0 #ffffff88}.cake{position:absolute;z-index:9;left:50%;bottom:6%;width:250px;height:330px;opacity:0;transform:translate(-50%,115%) scale(.55);transform-origin:50% 100%;filter:drop-shadow(0 16px 8px #17394c35)}.cake-pop .cake{animation:rise .8s cubic-bezier(.16,1.3,.3,1) forwards}@keyframes rise{65%{opacity:1;transform:translate(-50%,-4%) scale(1.06)}100%{opacity:1;transform:translate(-50%,0) scale(1)}}.plate{position:absolute;left:50%;bottom:0;width:260px;height:19px;transform:translateX(-50%);border-radius:50%;background:var(--cream);box-shadow:0 6px 0 #a7d8e7}.tier{position:absolute;left:50%;transform:translateX(-50%);border:4px solid var(--cream);border-radius:10px 10px 17px 17px;box-shadow:inset 0 -9px #00000010,0 5px 0 #c9864c}.tier:before{content:"";position:absolute;left:-4px;right:-4px;top:-7px;height:15px;border-radius:50%;background:var(--cream)}.t1{bottom:18px;width:232px;height:87px;background:var(--red)}.t2{bottom:97px;width:174px;height:75px;background:var(--blue)}.t3{bottom:164px;width:118px;height:66px;background:var(--yellow)}
.candles{position:absolute;z-index:4;left:50%;display:flex;justify-content:space-around;align-items:flex-end;transform:translateX(-50%)}.c1{bottom:108px;width:202px}.c2{bottom:175px;width:144px}.c3{bottom:234px;width:92px}.candle{position:relative;width:7px;height:27px;border-radius:3px 3px 0 0;background:repeating-linear-gradient(135deg,var(--cream) 0 4px,var(--red) 4px 8px)}.c2 .candle{background:repeating-linear-gradient(135deg,var(--cream) 0 4px,var(--blue) 4px 8px)}.c3 .candle{background:repeating-linear-gradient(135deg,var(--cream) 0 4px,#e0aa12 4px 8px)}.candle:before{content:"";position:absolute;left:50%;top:-13px;width:9px;height:13px;opacity:0;transform:translateX(-50%) scale(.1);transform-origin:50% 100%;border-radius:70% 30% 65% 35%;background:linear-gradient(#fff 0 20%,var(--yellow) 40%,var(--red));box-shadow:0 0 10px var(--yellow)}.lit .candle:before{opacity:1;animation:flame .5s ease-in-out infinite alternate}@keyframes flame{to{transform:translateX(-50%) scale(.8) rotate(7deg)}}.burst{position:absolute;z-index:15;inset:0;pointer-events:none}.burst i{position:absolute;top:-10%;width:8px;height:14px;background:var(--c);animation:fall var(--d) var(--delay) linear infinite}@keyframes fall{to{transform:translate3d(var(--x),115vh,0) rotate(720deg)}}
@media(max-width:640px){.scene{background:linear-gradient(#b9e7f5 0 57%,#2694ba 57% 100%)}.scene:after{top:57%}.prompt{top:8%;font-size:clamp(2.7rem,14vw,4.2rem)}.rower{left:-24%;bottom:10%;width:96vw}.wake{bottom:18%;width:55vw}.island{right:-1%;bottom:18%;width:92px;height:34px}.arrived .island{right:50%;bottom:5%;width:112vw;height:105px}@keyframes cross{0%{left:-24%;bottom:10%;transform:scale(.88)}25%{transform:scale(.88) translateY(-8px) rotate(-1deg)}55%{transform:scale(.78) translateY(1px) rotate(1deg)}78%{left:28%;bottom:15%;transform:scale(.62) translateY(-7px);opacity:1}100%{left:48%;bottom:19%;transform:scale(.36);opacity:0}}.cake{bottom:5%;transform:translate(-50%,115%) scale(.5)}.cake-pop .cake{animation-name:riseMobile}@keyframes riseMobile{65%{opacity:1;transform:translate(-50%,-3%) scale(.86)}100%{opacity:1;transform:translate(-50%,0) scale(.8)}}.birthday{top:5%;font-size:clamp(3rem,15vw,5rem)}}@media(max-height:650px){.prompt,.birthday{top:3%}.cake{bottom:-5%}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style></head><body><main id="scene" class="scene"><h1 class="prompt">Tap to row</h1><button id="rower" class="rower" type="button" aria-label="Seb rows to the island"><img src="assets/seb-rowing-editorial.png" alt="Seb rowing"></button><div class="wake" aria-hidden="true"></div><div class="island" aria-hidden="true"></div><div class="cake" aria-hidden="true"><div class="candles c1"><i class="candle"></i><i class="candle"></i><i class="candle"></i><i class="candle"></i><i class="candle"></i></div><div class="candles c2"><i class="candle"></i><i class="candle"></i><i class="candle"></i><i class="candle"></i></div><div class="candles c3"><i class="candle"></i><i class="candle"></i><i class="candle"></i></div><div class="tier t3"></div><div class="tier t2"></div><div class="tier t1"></div><div class="plate"></div></div><h2 class="birthday">Happy Birthday!!</h2><div id="burst" class="burst" aria-hidden="true"></div></main>
<script>let ctx;const scene=document.querySelector('#scene'),rower=document.querySelector('#rower');function audio(){ctx||=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function tone(f,t,d,v,type='square'){const c=audio(),o=c.createOscillator(),g=c.createGain(),q=c.createBiquadFilter();o.type=type;o.frequency.value=f;q.type='lowpass';q.frequency.value=type==='sawtooth'?1350:3200;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(q).connect(g).connect(c.destination);o.start(t);o.stop(t+d+.03)}function kick(t){const c=audio(),o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(145,t);o.frequency.exponentialRampToValueAtTime(44,t+.13);g.gain.setValueAtTime(.46,t);g.gain.exponentialRampToValueAtTime(.0001,t+.23);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.24)}function song(){const c=audio(),start=c.currentTime+.06,b=60/132,G=392,A=440,B=493.88,C=523.25,D=587.33,E=659.25,F=698.46,H=783.99,n=[[G,.5],[G,.5],[A,1],[G,1],[C,1],[B,2],[G,.5],[G,.5],[A,1],[G,1],[D,1],[C,2],[G,.5],[G,.5],[H,1],[E,1],[C,1],[B,1],[A,2],[F,.5],[F,.5],[E,1],[C,1],[D,1],[C,2]];let beats=0;n.forEach(x=>beats+=x[1]);for(let i=0;i<beats;i++)kick(start+i*b);let t=start;n.forEach(([f,d])=>{tone(f,t,d*b*.82,.065);tone(f,t,d*b*.82,.035,'sawtooth');t+=d*b})}function confetti(){const box=document.querySelector('#burst'),colors=['#f04f3d','#ffd45c','#fff8e7','#102a43','#4f9b69'];for(let i=0;i<72;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.setProperty('--c',colors[i%colors.length]);p.style.setProperty('--d',(3+Math.random()*2)+'s');p.style.setProperty('--delay',(-Math.random()*2.5)+'s');p.style.setProperty('--x',(-70+Math.random()*140)+'px');box.appendChild(p)}}rower.addEventListener('click',()=>{audio();rower.disabled=true;scene.classList.add('rowing');setTimeout(()=>scene.classList.add('arrived'),2200);setTimeout(()=>scene.classList.add('cake-pop'),2750);setTimeout(()=>{scene.classList.add('lit');confetti();song()},3600)});</script></body></html>
