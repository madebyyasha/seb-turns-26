<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#71d4f5"><meta name="description" content="A tiny rowing trip for Seb's birthday."><title>Seb turns 26</title>
<style>
:root{--sky:#72d5f5;--sea:#20a9d6;--sand:#ffd66b;--cream:#fff4dc;--coral:#ff765b;--aqua:#42cbd0;--lemon:#ffd84a;--ink:#073853}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font-family:Georgia,'Times New Roman',serif;color:var(--ink);background:var(--sky)}button{font:inherit}.scene{position:relative;width:100%;height:100svh;min-height:520px;overflow:hidden;background:linear-gradient(#72d5f5 0 55%,#d9f5ff 55% 60%,#20a9d6 60% 100%);isolation:isolate}.sun{position:absolute;top:7%;left:8%;width:74px;height:74px;border-radius:50%;background:#fff2a6;box-shadow:0 0 0 18px #fff4a630,0 0 50px #fff7c8}.cloud{position:absolute;top:15%;left:31%;width:88px;height:24px;border-radius:30px;background:#fff9;box-shadow:31px -12px 0 8px #fff9,64px 0 0 2px #fff9;animation:cloud 13s linear infinite alternate}@keyframes cloud{to{transform:translateX(11vw)}}.sea-lines{position:absolute;z-index:1;left:0;right:0;top:62%;bottom:0;background:repeating-linear-gradient(175deg,transparent 0 22px,#ffffff3d 23px 26px,transparent 27px 46px);animation:sea 4s linear infinite}@keyframes sea{to{background-position:80px 28px}}.prompt{position:absolute;z-index:9;top:8%;left:0;right:0;margin:0;text-align:center;font-size:clamp(2.3rem,7vw,5.2rem);letter-spacing:-.05em;text-shadow:0 3px #fff8;transition:.45s}.rowing .prompt{opacity:0;transform:translateY(-14px)}
.rower{position:absolute;z-index:7;left:5%;bottom:14%;width:150px;height:116px;padding:0;border:0;background:transparent;cursor:pointer;touch-action:manipulation;filter:drop-shadow(0 10px 7px #045a7855);animation:bob 1.25s ease-in-out infinite alternate}.rower-char{display:block;font:normal 92px/1 'Apple Color Emoji','Segoe UI Emoji',sans-serif;transform:scaleX(-1)}.rower:after{content:"";position:absolute;left:8px;right:2px;bottom:0;height:8px;border-radius:50%;background:#fff8;transform:scaleX(.8)}@keyframes bob{to{transform:translateY(-8px) rotate(-2deg)}}.rowing .rower{animation:rowToIsland 2.6s cubic-bezier(.2,.72,.22,1) forwards}@keyframes rowToIsland{0%{left:5%;bottom:14%;transform:translateY(0);opacity:1}22%{transform:translateY(-12px) rotate(-4deg)}44%{transform:translateY(2px) rotate(3deg)}66%{transform:translateY(-12px) rotate(-4deg)}88%{left:69%;bottom:20%;transform:translateY(0) rotate(1deg);opacity:1}100%{left:72%;bottom:22%;transform:scale(.45);opacity:0}}
.island{position:absolute;z-index:4;right:3.5%;bottom:18%;width:146px;height:68px;transform-origin:70% 100%;transition:all .85s cubic-bezier(.16,1.1,.28,1)}.island:before{content:"";position:absolute;inset:16px 0 0;border-radius:50%;background:var(--sand);box-shadow:inset 0 -13px #eca949,0 8px 0 #ffffff70}.island:after{content:"🌴";position:absolute;right:18px;top:-34px;font:normal 64px/1 'Apple Color Emoji','Segoe UI Emoji',sans-serif;transform:rotate(7deg)}.arrived .island{right:50%;bottom:8%;width:min(78vw,780px);height:180px;transform:translateX(50%)}.arrived .island:before{inset:38px 0 0;box-shadow:inset 0 -28px #eca949,0 13px 0 #ffffff70}.arrived .island:after{right:7%;top:-36px;font-size:112px}
.cake{position:absolute;z-index:6;left:50%;bottom:7%;width:310px;height:430px;opacity:0;transform:translate(-50%,120%) scale(.2);transform-origin:50% 100%;filter:drop-shadow(0 18px 12px #075b7640)}.cake-pop .cake{animation:cakeRise .95s cubic-bezier(.16,1.35,.3,1) forwards}@keyframes cakeRise{65%{opacity:1;transform:translate(-50%,-4%) scale(1.12)}100%{opacity:1;transform:translate(-50%,0) scale(1)}}.plate{position:absolute;left:50%;bottom:0;width:330px;height:25px;transform:translateX(-50%);border-radius:50%;background:#e7faff;border:5px solid #fff;box-shadow:0 8px #7ccbe0}.tier{position:absolute;left:50%;transform:translateX(-50%);border:5px solid #fffaf0;background:linear-gradient(90deg,#fff4dc,#fffdf1 48%,#ffecc8);box-shadow:inset 0 -15px #f2c978,0 7px #dcae55;border-radius:18px 18px 30px 30px}.tier:after{content:"";position:absolute;left:10%;right:10%;top:19px;height:11px;border-radius:20px;background:repeating-linear-gradient(90deg,var(--coral) 0 18px,var(--aqua) 18px 36px,var(--lemon) 36px 54px)}.t1{bottom:24px;width:290px;height:116px}.t2{bottom:132px;width:225px;height:100px}.t3{bottom:224px;width:158px;height:88px}.candles{position:absolute;z-index:3;left:50%;transform:translateX(-50%);display:flex;justify-content:space-around;align-items:flex-end}.c1{bottom:137px;width:250px}.c2{bottom:234px;width:185px}.c3{bottom:316px;width:122px}.candle{position:relative;width:10px;height:35px;border-radius:3px;background:repeating-linear-gradient(135deg,#fff 0 5px,var(--coral) 5px 10px);box-shadow:0 2px #b24e3a}.c2 .candle{background:repeating-linear-gradient(135deg,#fff 0 5px,var(--aqua) 5px 10px)}.c3 .candle{background:repeating-linear-gradient(135deg,#fff 0 5px,var(--lemon) 5px 10px)}.candle:before{content:"";position:absolute;left:50%;top:-15px;width:10px;height:15px;transform:translateX(-50%) scale(.05);transform-origin:50% 100%;opacity:0;border-radius:75% 25% 65% 35%;background:linear-gradient(#fffbd0 0 30%,#ffd04f 48%,#ff8b3d 100%);box-shadow:0 0 7px #fff4a3,0 0 14px #ffbd40}.lit .candle:before{opacity:1;animation:flame .48s ease-in-out infinite alternate}@keyframes flame{to{transform:translateX(-50%) scale(.82) rotate(7deg)}}
.birthday{position:absolute;z-index:10;left:50%;top:7%;width:95%;margin:0;transform:translate(-50%,20px) scale(.8);opacity:0;text-align:center;color:#fff;font-size:clamp(3rem,10vw,7rem);line-height:.9;letter-spacing:-.055em;text-shadow:0 5px #0783b4,0 12px 28px #07567655}.lit .birthday{animation:titleIn .8s .08s cubic-bezier(.18,1.3,.3,1) forwards}@keyframes titleIn{to{opacity:1;transform:translate(-50%,0) scale(1)}}.confetti{position:absolute;z-index:8;inset:0;pointer-events:none;overflow:hidden}.confetti i{position:absolute;top:-12%;width:9px;height:16px;background:var(--c);animation:fall var(--d) var(--delay) linear infinite}@keyframes fall{to{transform:translate3d(var(--drift),115vh,0) rotate(780deg)}}
@media(max-width:640px){.prompt{top:7%;font-size:clamp(2.5rem,13vw,4.2rem)}.sun{width:56px;height:56px;top:15%;left:7%}.cloud{top:20%;left:29%;transform:scale(.72)}.rower{left:-4%;bottom:12%;transform:scale(.76)}.island{right:-2%;bottom:20%;width:104px;height:52px}.island:after{right:5px;font-size:50px}.arrived .island{right:50%;bottom:9%;width:112vw;height:148px}.arrived .island:after{right:12%;top:-25px;font-size:86px}@keyframes rowToIsland{0%{left:-4%;bottom:12%;transform:scale(.76);opacity:1}25%{transform:scale(.76) translateY(-12px) rotate(-4deg)}50%{transform:scale(.76) translateY(2px) rotate(3deg)}75%{left:58%;transform:scale(.7) translateY(-10px) rotate(-3deg);opacity:1}100%{left:70%;bottom:20%;transform:scale(.35);opacity:0}}.cake{bottom:7%;transform:translate(-50%,120%) scale(.16)}.cake-pop .cake{animation-name:cakeRiseMobile}@keyframes cakeRiseMobile{65%{opacity:1;transform:translate(-50%,-3%) scale(.92)}100%{opacity:1;transform:translate(-50%,0) scale(.82)}}.birthday{top:5%;font-size:clamp(3rem,16vw,5rem)}}@media(max-height:650px){.cake{bottom:-5%}.birthday{top:2%}.prompt{top:3%}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style></head><body><main id="scene" class="scene"><div class="sun" aria-hidden="true"></div><div class="cloud" aria-hidden="true"></div><div class="sea-lines" aria-hidden="true"></div><h1 class="prompt">Tap to row</h1><button id="rower" class="rower" type="button" aria-label="Row to the island"><span class="rower-char">🚣‍♂️</span></button><div class="island" aria-hidden="true"></div><div class="cake" aria-hidden="true"><div class="candles c1"><i class="candle"></i><i class="candle"></i><i class="candle"></i><i class="candle"></i><i class="candle"></i><i class="candle"></i></div><div class="candles c2"><i class="candle"></i><i class="candle"></i><i class="candle"></i><i class="candle"></i><i class="candle"></i></div><div class="candles c3"><i class="candle"></i><i class="candle"></i><i class="candle"></i><i class="candle"></i></div><div class="tier t3"></div><div class="tier t2"></div><div class="tier t1"></div><div class="plate"></div></div><h2 class="birthday">Happy Birthday!!</h2><div id="confetti" class="confetti" aria-hidden="true"></div></main>
<script>
let audioCtx;const scene=document.querySelector('#scene'),rower=document.querySelector('#rower');function audio(){audioCtx||=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}function tone(f,t,d,v,type='square'){const c=audio(),o=c.createOscillator(),g=c.createGain(),q=c.createBiquadFilter();o.type=type;o.frequency.value=f;q.type='lowpass';q.frequency.value=type==='sawtooth'?1350:3200;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(q).connect(g).connect(c.destination);o.start(t);o.stop(t+d+.03)}function kick(t){const c=audio(),o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(145,t);o.frequency.exponentialRampToValueAtTime(44,t+.13);g.gain.setValueAtTime(.48,t);g.gain.exponentialRampToValueAtTime(.0001,t+.23);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.24)}function noise(t,d,v){const c=audio(),b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=b;f.type='highpass';f.frequency.value=6000;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f).connect(g).connect(c.destination);s.start(t)}function song(){const c=audio(),start=c.currentTime+.06,b=60/132,G=392,A=440,B=493.88,C=523.25,D=587.33,E=659.25,F=698.46,G5=783.99,n=[[G,.5],[G,.5],[A,1],[G,1],[C,1],[B,2],[G,.5],[G,.5],[A,1],[G,1],[D,1],[C,2],[G,.5],[G,.5],[G5,1],[E,1],[C,1],[B,1],[A,2],[F,.5],[F,.5],[E,1],[C,1],[D,1],[C,2]];let beats=0;n.forEach(x=>beats+=x[1]);for(let i=0;i<beats;i++){kick(start+i*b);noise(start+i*b+b*.5,.045,.045)}let t=start;n.forEach(([f,d])=>{tone(f,t,Math.max(.09,d*b*.82),.07,'square');tone(f,t,Math.max(.09,d*b*.82),.04,'sawtooth');t+=d*b})}function party(){const box=document.querySelector('#confetti'),colors=['#ff765b','#ffd84a','#fff','#42cbd0','#58b95c'];for(let i=0;i<90;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.setProperty('--c',colors[i%colors.length]);p.style.setProperty('--d',(3+Math.random()*2.5)+'s');p.style.setProperty('--delay',(-Math.random()*3)+'s');p.style.setProperty('--drift',(-80+Math.random()*160)+'px');box.appendChild(p)}}rower.addEventListener('click',()=>{audio();rower.disabled=true;scene.classList.add('rowing');setTimeout(()=>scene.classList.add('arrived'),2350);setTimeout(()=>scene.classList.add('cake-pop'),3050);setTimeout(()=>{scene.classList.add('lit');party();song()},3950)});
</script></body></html>
