<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11122f"><meta name="description" content="Strike a birthday match for Seb."><title>A birthday match for Seb</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23ffd76b' d='M28 25h8v34h-8z'/%3E%3Cpath fill='%23ff9a45' d='M32 4c10 11 7 19 0 22-7-3-10-11 0-22z'/%3E%3C/svg%3E"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11122f}body{color:#fff8e7;font-family:Georgia,'Times New Roman',serif}.scene{position:relative;width:100%;height:100svh;min-height:540px;overflow:hidden;background:radial-gradient(circle at 50% 42%,#343568 0,#1d2048 42%,#0d102a 100%)}canvas{display:block;width:100%;height:100%}.prompt{position:absolute;z-index:2;top:16%;left:16px;right:16px;text-align:center;transition:.6s ease;pointer-events:none}.prompt h1{margin:0;font-size:clamp(2.2rem,7vw,4.6rem);font-weight:400;line-height:1.02;letter-spacing:-.035em}.prompt p{margin:.75rem 0 0;font:700 .7rem/1 Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#c5c9ef}.started .prompt{opacity:0;transform:translateY(-12px)}.strike{position:absolute;z-index:3;left:50%;top:45%;width:min(72vw,310px);height:100px;transform:translate(-50%,-50%);border:0;background:transparent;cursor:pointer}.strike:focus-visible{outline:2px solid #fff;outline-offset:8px;border-radius:50px}.final{position:absolute;z-index:3;top:7%;left:8px;right:8px;text-align:center;opacity:0;transform:scale(.74);pointer-events:none}.final strong{display:block;font-size:clamp(3.3rem,12vw,7.4rem);font-weight:400;line-height:.88;letter-spacing:-.05em;text-shadow:0 0 10px #fff,0 0 32px #ffd35f}.final span{display:block;margin-top:14px;font:700 .7rem/1 Arial,sans-serif;letter-spacing:.26em;text-transform:uppercase;color:#d9dcff}.complete .final{animation:show 1s cubic-bezier(.18,1.28,.3,1) forwards}@keyframes show{to{opacity:1;transform:scale(1)}}@media(max-height:650px){.prompt{top:9%}.final{top:4%}}
</style></head><body><main class="scene" id="scene"><canvas id="art" aria-label="A match lights Seb's birthday cake"></canvas><section class="prompt"><h1>Strike a match for Seb.</h1><p>Tap the match</p></section><button id="strike" class="strike" aria-label="Strike Seb's birthday match"></button><section class="final" aria-live="polite"><strong>Happy Birthday!</strong><span>Make it a brilliant one, Seb</span></section></main><script>
(()=>{const c=document.querySelector('#art'),g=c.getContext('2d'),scene=document.querySelector('#scene'),btn=document.querySelector('#strike');let W,H,D,t0=0,on=false,A,audioStart=0,stars=[];const C=(n,a=0,b=1)=>Math.max(a,Math.min(b,n)),E=n=>1-Math.pow(1-C(n),3),L=(a,b,t)=>a+(b-a)*t;
function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);stars=Array.from({length:42},(_,i)=>({x:(i*71%941)/941*W,y:(i*53%401)/401*H*.72,r:.5+(i%3)*.35,p:i*.8}))}addEventListener('resize',size);size();
function glow(x,y,r,col='#ffd56b'){const q=g.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,'#fffde4');q.addColorStop(.18,col);q.addColorStop(1,'transparent');g.fillStyle=q;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function bg(t,bright){g.clearRect(0,0,W,H);for(const s of stars){g.globalAlpha=.18+.38*Math.sin(t*.0012+s.p)+bright*.22;g.fillStyle='#fff0a5';g.beginPath();g.arc(s.x,s.y,s.r,0,7);g.fill()}g.globalAlpha=1}
function flame(x,y,s,t){glow(x,y,32*s);g.fillStyle='#fff4a3';g.beginPath();g.moveTo(x,y-15*s);g.bezierCurveTo(x+10*s,y-3*s,x+7*s,y+10*s,x,y+12*s);g.bezierCurveTo(x-9*s,y+7*s,x-8*s,y-3*s,x,y-15*s);g.fill();g.fillStyle='#ff9d48';g.beginPath();g.ellipse(x,y+3*s,3*s,7*s,Math.sin(t*.01)*.08,0,7);g.fill()}
function match(x,y,angle,lit,t){g.save();g.translate(x,y);g.rotate(angle);g.lineCap='round';g.strokeStyle='#e5c28a';g.lineWidth=7;g.beginPath();g.moveTo(-72,0);g.lineTo(62,0);g.stroke();g.fillStyle=lit?'#2f2225':'#c65e55';g.beginPath();g.ellipse(70,0,12,9,0,0,7);g.fill();if(lit)flame(72,-10,1,t);g.restore()}
function tier(y,w,h,color){g.fillStyle='rgba(0,0,20,.22)';g.beginPath();g.roundRect(-w/2+4,y+7,w,h,14);g.fill();g.fillStyle=color;g.strokeStyle='#fffaf1';g.lineWidth=3;g.beginPath();g.roundRect(-w/2,y,w,h,14);g.fill();g.stroke();g.fillStyle='#fffaf1';g.beginPath();g.ellipse(0,y+3,w/2-2,9,0,0,7);g.fill();g.fillStyle='#f3c96f';for(let x=-w*.31;x<=w*.31;x+=w*.155){g.beginPath();g.arc(x,y+h*.62,3,0,7);g.fill()}}
function cake(p,lit,t){const s=Math.min(1.05,W/390),base=L(H+95,H*.88,E(p));g.save();g.translate(W/2,base);g.scale(s,s);g.fillStyle='#dff5f3';g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.ellipse(0,8,112,16,0,0,7);g.fill();g.stroke();tier(-45,198,52,'#8fcfd7');tier(-90,151,48,'#b8abe0');tier(-131,106,44,'#efb7d1');for(let i=0;i<5;i++){const x=(i-2)*17;g.fillStyle=i%2?'#78c8df':'#f3a9bd';g.fillRect(x-3,-154,6,23);if(lit>i/5)flame(x,-161,.5,t)}g.restore()}
function scheduleMusic(){try{A=new(window.AudioContext||window.webkitAudioContext)();A.resume();const master=A.createGain();master.gain.value=.62;master.connect(A.destination);audioStart=A.currentTime+2.75;const N=[[392,.28],[392,.18],[440,.45],[392,.45],[523,.45],[494,.8],[392,.28],[392,.18],[440,.45],[392,.45],[587,.45],[523,.8],[392,.28],[392,.18],[784,.45],[659,.45],[523,.45],[494,.45],[440,.8],[698,.28],[698,.18],[659,.45],[523,.45],[587,.45],[523,.9]];let at=audioStart;N.forEach(([f,d])=>{[['triangle',f,.11],['sine',f*2,.018]].forEach(([type,h,v])=>{const o=A.createOscillator(),q=A.createGain();o.type=type;o.frequency.value=h;q.gain.setValueAtTime(.001,at);q.gain.linearRampToValueAtTime(v,at+.03);q.gain.exponentialRampToValueAtTime(.001,at+d);o.connect(q).connect(master);o.start(at);o.stop(at+d+.04)});at+=d})}catch(e){}}
function draw(t){const e=on?(t-t0)/1000:0,lit=C((e-1.65)/.85),rise=C((e-.8)/1.2);bg(t,lit);cake(rise,lit,t);if(!on){g.strokeStyle='#a97266';g.lineWidth=5;g.beginPath();g.moveTo(W/2-95,H*.45+23);g.lineTo(W/2+95,H*.45+23);g.stroke();match(W/2,H*.45,0,false,t)}else if(e<1.7){const strike=E(e/.48),travel=E((e-.45)/1.15),x=e<.5?L(W*.38,W*.62,strike):L(W*.62,W*.5,travel),y=e<.5?H*.45:L(H*.45,H*.88-175,travel),ang=e<.5?-.12:L(-.12,.45,travel);match(x,y,ang,e>.28,t);if(e<.55)for(let i=0;i<12;i++){g.fillStyle='#ffd35c';g.globalAlpha=C(1-e/.6);g.fillRect(W*.45+i*8+Math.sin(i)*7,H*.45+(i%4)*5,3,3)}g.globalAlpha=1}if(e>2.7&&!scene.classList.contains('complete'))scene.classList.add('complete');requestAnimationFrame(draw)}
btn.addEventListener('click',()=>{on=true;t0=performance.now();scene.classList.add('started');btn.disabled=true;scheduleMusic()},{once:true});requestAnimationFrame(draw)})();
</script></body></html>
