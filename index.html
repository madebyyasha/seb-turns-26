<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071633"><meta name="description" content="A little birthday voyage for Seb."><title>A little light for Seb</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23ffe38a' d='M9 43h46L32 8z'/%3E%3Cpath fill='%230d3150' d='M29 25h6v32h-6z'/%3E%3C/svg%3E"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071633}body{font-family:Georgia,'Times New Roman',serif;color:#fff9df}.scene{position:relative;width:100%;height:100svh;min-height:520px;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:manipulation}.intro{position:absolute;z-index:2;top:11%;left:18px;right:18px;text-align:center;pointer-events:none;transition:.7s ease}.intro h1{margin:0;font-size:clamp(2rem,7vw,4.4rem);font-weight:400;line-height:1.06;text-shadow:0 3px 22px #020b1d}.intro p{margin:.75rem 0 0;font:700 .72rem/1.2 Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#bfe7ef}.started .intro{opacity:0;transform:translateY(-14px)}.launch{position:absolute;z-index:3;left:50%;bottom:12%;width:96px;height:96px;transform:translateX(-50%);border:1px solid #fff5bd99;border-radius:50%;background:radial-gradient(circle,#fff8cf 0 8%,#ffd66a 9% 17%,#ffae4233 19% 43%,transparent 65%);color:#fff9df;font:700 .68rem/1.15 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;filter:drop-shadow(0 0 18px #ffd45e);animation:pulse 2s ease-in-out infinite;transition:.45s}.launch:hover{transform:translateX(-50%) scale(1.06)}.launch:focus-visible{outline:3px solid #fff;outline-offset:5px}.started .launch{opacity:0;transform:translate(-50%,35px) scale(.7);pointer-events:none}.final{position:absolute;z-index:3;top:7%;left:10px;right:10px;text-align:center;opacity:0;transform:scale(.72);pointer-events:none}.final strong{display:block;font-size:clamp(3rem,11vw,7rem);font-weight:400;line-height:.9;text-shadow:0 0 12px #fff,0 0 34px #ffd85f}.final span{display:block;margin-top:13px;font:700 .72rem/1 Arial,sans-serif;letter-spacing:.26em;text-transform:uppercase;color:#c8eff4}.complete .final{animation:reveal 1s cubic-bezier(.15,1.25,.3,1) forwards}@keyframes pulse{50%{filter:drop-shadow(0 0 30px #ffe585);transform:translateX(-50%) scale(1.05)}}@keyframes reveal{to{opacity:1;transform:scale(1)}}@media(max-height:630px){.intro{top:7%}.launch{bottom:7%}.final{top:4%}}
</style></head><body><main class="scene" id="scene"><canvas id="story" aria-label="An animated moonlit birthday voyage for Seb"></canvas><section class="intro"><h1>A little light is looking for Seb.</h1><p>Send it on its way</p></section><button class="launch" id="launch" type="button" aria-label="Launch Seb's birthday light">send<br>the light</button><section class="final" aria-live="polite"><strong>Happy Birthday!</strong><span>for Seb, with a little magic</span></section></main><script>
(()=>{const canvas=document.querySelector('#story'),g=canvas.getContext('2d'),scene=document.querySelector('#scene'),launch=document.querySelector('#launch');let W,H,dpr=1,start=0,running=false,stars=[];const clamp=(n,a=0,b=1)=>Math.max(a,Math.min(b,n)),ease=n=>1-Math.pow(1-clamp(n),3),lerp=(a,b,t)=>a+(b-a)*t;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:70},(_,i)=>({x:(i*83%997)/997*W,y:(i*47%431)/431*H*.58,r:.6+(i%4)*.38,p:i*.61}))}addEventListener('resize',resize);resize();
function sky(t){const q=g.createLinearGradient(0,0,0,H);q.addColorStop(0,'#06132e');q.addColorStop(.58,'#183f65');q.addColorStop(1,'#0a3750');g.fillStyle=q;g.fillRect(0,0,W,H);for(const s of stars){g.globalAlpha=.35+.45*Math.sin(t*.0012+s.p);g.fillStyle='#fff5bf';g.beginPath();g.arc(s.x,s.y,s.r,0,7);g.fill()}g.globalAlpha=1;const mx=W*.78,my=H*.2,mr=Math.min(W,H)*.07,glow=g.createRadialGradient(mx,my,2,mx,my,mr*2.4);glow.addColorStop(0,'#fffce0');glow.addColorStop(.3,'#fff1a8');glow.addColorStop(1,'transparent');g.fillStyle=glow;g.beginPath();g.arc(mx,my,mr*2.4,0,7);g.fill();g.fillStyle='#fff8ce';g.beginPath();g.arc(mx,my,mr,0,7);g.fill()}
function sea(t){const top=H*.59,q=g.createLinearGradient(0,top,0,H);q.addColorStop(0,'#1d6980');q.addColorStop(1,'#052940');g.fillStyle=q;g.fillRect(0,top,W,H-top);g.strokeStyle='#a9edf080';g.lineWidth=1.4;for(let j=0;j<7;j++){g.beginPath();for(let x=-20;x<W+20;x+=12){const y=top+17+j*36+Math.sin(x*.025+t*.0015+j)*4;x===-20?g.moveTo(x,y):g.lineTo(x,y)}g.stroke()}}
function lighthouse(beam){const x=W*.82,y=H*.53,h=Math.min(185,H*.25),w=h*.24;g.fillStyle='#102a3e';g.beginPath();g.moveTo(x-w*.7,y);g.lineTo(x+w*.7,y);g.lineTo(x+w*.43,y-h);g.lineTo(x-w*.43,y-h);g.closePath();g.fill();for(let i=0;i<4;i++){g.fillStyle=i%2?'#e7efe9':'#d65b55';g.fillRect(x-w*.42,y-h+i*h/4,w*.84,h/4)}g.fillStyle='#172839';g.fillRect(x-w*.65,y-h-14,w*1.3,14);g.beginPath();g.moveTo(x-w*.8,y-h-14);g.lineTo(x,y-h-34);g.lineTo(x+w*.8,y-h-14);g.fill();g.fillStyle=beam?'#fff5a9':'#7297a5';g.fillRect(x-w*.34,y-h-12,w*.68,11);if(beam){const grad=g.createLinearGradient(x,0,W*.18,0);grad.addColorStop(0,'#fff4a090');grad.addColorStop(1,'#fff4a000');g.fillStyle=grad;g.beginPath();g.moveTo(x,y-h-7);g.lineTo(W*.08,H*.32);g.lineTo(W*.08,H*.49);g.closePath();g.fill()}g.fillStyle='#112f3d';g.beginPath();g.ellipse(x,y+4,w*2.6,w*.42,0,0,7);g.fill()}
function boat(x,y,bob){g.save();g.translate(x,y+bob);g.fillStyle='#e9a65a';g.strokeStyle='#fff0ca';g.lineWidth=2;g.beginPath();g.moveTo(-34,0);g.quadraticCurveTo(0,22,37,0);g.closePath();g.fill();g.stroke();g.strokeStyle='#e7f2ed';g.beginPath();g.moveTo(0,0);g.lineTo(0,-45);g.stroke();g.fillStyle='#f7e4b0';g.beginPath();g.moveTo(2,-43);g.lineTo(29,-8);g.lineTo(2,-8);g.closePath();g.fill();const glow=g.createRadialGradient(-8,-16,1,-8,-16,30);glow.addColorStop(0,'#fffbd4');glow.addColorStop(.25,'#ffd65e');glow.addColorStop(1,'transparent');g.fillStyle=glow;g.beginPath();g.arc(-8,-16,30,0,7);g.fill();g.restore()}
function cake(p){const x=W*.5,base=H+95-160*ease(p),scale=Math.min(1,W/430);g.save();g.translate(x,base);g.scale(scale,scale);g.lineWidth=3;g.strokeStyle='#fff9e8';const tiers=[[-92,-48,184,50,'#8fcbd7'],[-70,-93,140,47,'#b7a9df'],[-48,-135,96,44,'#f0b8cf']];tiers.forEach(a=>{g.fillStyle=a[4];g.beginPath();g.roundRect(a[0],a[1],a[2],a[3],13);g.fill();g.stroke();g.fillStyle='#fff8e8';g.beginPath();g.ellipse(0,a[1]+3,a[2]/2-2,8,0,0,7);g.fill()});g.fillStyle='#ffe16b';for(let i=-2;i<=2;i++){g.fillRect(i*17-2,-157,5,22);g.beginPath();g.ellipse(i*17,-163,5,9,0,0,7);g.fill()}g.restore()}
function music(){try{const A=AudioContext||webkitAudioContext,c=new A(),m=c.createGain();m.gain.value=.55;m.connect(c.destination);const notes=[[392,.28],[392,.18],[440,.45],[392,.45],[523,.45],[494,.8],[392,.28],[392,.18],[440,.45],[392,.45],[587,.45],[523,.8],[392,.28],[392,.18],[784,.45],[659,.45],[523,.45],[494,.45],[440,.8],[698,.28],[698,.18],[659,.45],[523,.45],[587,.45],[523,.9]];let at=c.currentTime+.08;notes.forEach(([f,d])=>{['triangle','sine'].forEach((type,k)=>{const o=c.createOscillator(),v=c.createGain();o.type=type;o.frequency.value=f*(k?2:1);v.gain.setValueAtTime(.001,at);v.gain.linearRampToValueAtTime(k?.018:.12,at+.03);v.gain.exponentialRampToValueAtTime(.001,at+d);o.connect(v).connect(m);o.start(at);o.stop(at+d+.03)});at+=d})}catch(e){}}
function draw(now){sky(now);sea(now);const elapsed=running?(now-start)/1000:0,travel=ease((elapsed-.15)/3.2),beam=elapsed>3.15;lighthouse(beam);if(running&&elapsed<3.65)boat(lerp(-50,W*.81,travel),H*.64,Math.sin(now*.008)*4);if(elapsed>3.35)cake(clamp((elapsed-3.35)/1.3));if(elapsed>4.1&&!scene.classList.contains('complete')){scene.classList.add('complete');music()}requestAnimationFrame(draw)}launch.addEventListener('click',()=>{if(running)return;running=true;start=performance.now();scene.classList.add('started')},{once:true});requestAnimationFrame(draw)})();
</script></body></html>
